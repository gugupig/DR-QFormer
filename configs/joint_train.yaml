# Joint Training Configuration for DR-QFormer
# Tasks: E (Entailment), S (Ranking), C (Contrastive NLL)

# =============================================================================
# Model Architecture
# =============================================================================
model:
  # Q-Former
  d: 768                      # Hidden dimension
  num_lqs: 32                 # Number of Latent Query slots
  num_heads: 12               # Multi-head attention heads
  num_blocks: 6               # Transformer blocks
  mlp_ratio: 4.0              # MLP expansion ratio
  
  # LM Projection (for Task C)
  num_lm_tokens: 32           # Number of tokens passed to LLM
  d_lm: 4096                  # LLM hidden dimension
  
  # Drop-LQ
  drop_lq_rate: 0.1           # Drop rate for LQ slots (unified across E/S/C)
  lq_entropy_lambda: 0.01     # Entropy regularization for LQ drop


# =============================================================================
# Task Heads
# =============================================================================
heads:
  # Task E: Entailment Head
  entailment:
    aggregation_mode: "lse"   # Options: "lse", "mean", "max"
    lse_r: 10.0               # LSE temperature
    use_drop_lq: true         # Apply Drop-LQ mask
  
  # Task S: Fragment Ranking Head
  ranking:
    aggregation_mode: "nested_lse"  # "nested_lse" or "mean"
    head_lse_r: 5.0           # First-stage LSE (across heads)
    lq_lse_r: 10.0            # Second-stage LSE (across LQs)
    use_drop_lq: true


# =============================================================================
# Loss Functions
# =============================================================================
losses:
  # Task E: Focal Loss
  focal:
    gamma: 2.0                # Focal factor (harder negatives get more weight)
    alpha: 0.25               # Class balance (for minority positive class)
    use_importance_weights: true  # Use per-fragment importance weights
  
  # Task S: Ranking Loss
  ranking:
    # Teacher (prior)
    lambda_teach_start: 1.0
    lambda_teach_end: 0.2
    temperature: 1.0          # For adaptive teacher distribution
    alpha_gt: 0.9             # Target cumulative probability for Top-L
    
    # Posterior (from Task C)
    lambda_post_start: 0.0
    lambda_post_end: 0.8
    
    # Tail entropy regularization
    lambda_ent_start: 0.01
    lambda_ent_end: 0.001
    
    # Training subset U
    top_l_dynamic: true       # Use adaptive Top-L based on α_gt
    top_lprime: 10            # Hard negatives from student
    
  # Task C: Contrastive NLL
  contrastive:
    softplus_beta: 10.0       # Sharpness of Softplus
    adaptive_margin: true     # Use adaptive margin (μ_G + κσ_G)
    margin_kappa: 0.5         # Multiplier for std dev
    margin_min: 0.1           # Minimum margin
    margin_max: 2.0           # Maximum margin


# =============================================================================
# Training Schedule
# =============================================================================
schedule:
  total_steps: 50000          # Total training steps
  
  # Phase boundaries (as fraction of total_steps)
  warmup_frac: 0.1            # Warm-up: prior-only, ~10%
  bridge_frac: 0.6            # Bridge: prior→posterior, ~60%
  closedloop_frac: 0.3        # Closed-loop: posterior-dominant, ~30%
  
  # Task weights
  w_E_start: 1.0
  w_E_end: 0.5
  w_E_decay_frac: 0.3         # Decay over first 30%
  
  w_S: 1.0                    # Constant
  
  w_C_start: 0.5
  w_C_end: 1.0
  w_C_ramp_frac: 0.3          # Ramp up over first 30%
  
  # Optional: Dual mode (QG)
  enable_dual: false
  lambda_dual: 0.2
  
  # Optional: Attention consistency (between QA and QG)
  enable_ac: false
  lambda_ac: 0.05


# =============================================================================
# Optimizer & Learning Rate
# =============================================================================
optimizer:
  type: "adamw"
  lr: 1.0e-4                  # Base learning rate
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  
  # Learning rate schedule
  lr_schedule: "cosine"       # Options: "cosine", "linear", "constant"
  warmup_steps: 5000          # LR warmup steps
  min_lr: 1.0e-6              # Minimum LR for cosine schedule


# =============================================================================
# Data
# =============================================================================
data:
  # PLACEHOLDER: Replace with actual dataset paths
  train_path: "data/train.json"
  val_path: "data/val.json"
  
  # Batching
  batch_size: 8
  max_fragments: 100          # Max K per sample (pad shorter pools)
  num_workers: 4
  
  # PLACEHOLDER: Retriever config
  retriever:
    type: "bm25"              # Options: "bm25", "dense", "hybrid"
    corpus_path: "data/corpus.json"
    top_k: 100
  
  # PLACEHOLDER: Embedding model
  embedder:
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    max_length: 512
  
  # PLACEHOLDER: LLM tokenizer
  tokenizer:
    model_name: "meta-llama/Llama-2-7b-hf"
    max_q_length: 128
    max_a_length: 256


# =============================================================================
# LLM (for Task C)
# =============================================================================
llm:
  # PLACEHOLDER: Replace with actual LLM
  model_name: "meta-llama/Llama-2-7b-hf"
  load_in_8bit: true          # Use 8-bit quantization
  device_map: "auto"
  freeze: true                # Always freeze LLM in Stage-1 training


# =============================================================================
# Training & Logging
# =============================================================================
training:
  num_epochs: 10
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0          # Gradient clipping
  
  # Mixed precision
  use_amp: true               # Automatic Mixed Precision (FP16/BF16)
  amp_dtype: "bf16"           # Options: "fp16", "bf16"
  
  # Checkpointing
  save_dir: "./checkpoints/joint_train"
  save_every_steps: 5000
  keep_last_n: 3              # Keep only last N checkpoints
  
  # Logging
  log_interval: 100
  eval_every_steps: 2000
  
  # Experiment tracking (optional)
  use_wandb: false
  wandb_project: "dr-qformer-joint"
  wandb_run_name: "joint_e_s_c_v1"


# =============================================================================
# Validation
# =============================================================================
validation:
  batch_size: 16
  max_fragments: 100
  
  # Metrics to track
  metrics:
    - "entailment_accuracy"
    - "entailment_precision"
    - "entailment_recall"
    - "entailment_f1"
    - "ranking_ndcg@10"
    - "ranking_ndcg@20"
    - "ranking_map"
    - "contrastive_gain"
    - "contrastive_perplexity"


# =============================================================================
# Hardware & Performance
# =============================================================================
hardware:
  device: "cuda"              # Options: "cuda", "cpu", "mps"
  num_gpus: 1
  distributed: false          # Use DistributedDataParallel
  
  # Memory optimization
  pin_memory: true
  non_blocking: true


# =============================================================================
# Reproducibility
# =============================================================================
seed: 42


